# Mosquitto configuration for LOCAL DEVELOPMENT ONLY.
#
# Production uses a managed broker (HiveMQ Cloud for the pilot, AWS IoT Core as
# the scale path — docs/device-protocol.md §9). This exists so the protocol can
# be developed and tested against a broker that enforces the same topic rules
# as production: a protocol tested only against a permissive broker is a
# protocol whose ACLs are untested, and the ACL is the second line of defence
# that stops one *device* from attacking another.

listener 1883
protocol mqtt

# No anonymous clients, even here.
#
# The point of running a real broker locally is to catch the mistakes a
# permissive one hides, and "it worked on my machine because anything could
# connect" is the first of them.
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# Persist the retained /state and /status messages across a restart.
#
# Not incidental: the server learns a device's state on *its own* reconnect
# from the retained message, so a broker that forgot them would make local
# development behave differently from production in exactly the area this
# protocol is careful about.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
# Connection logging on, deliberately: when a device cannot talk to the broker,
# the first question is always whether it connected and what identity it used.
connection_messages true
